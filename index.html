<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMPSON - Comparativo v1.2.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.jpg" alt="Logo Sampson" class="logo-img">
        <div class="header-text">
            <h2>CUADRO COMPARATIVO DE OFERTAS</h2>
            <p>Departamento de Compras y Planificación</p>
        </div>
    </header>

    <div class="container">
        <section id="form-section">
            <div class="input-main">
                <label>Descripción del Producto o Servicio:</label>
                <input type="text" id="prod-nombre" placeholder="Ej: Material de empaque / Suministro eléctrico">
            </div>

            <div class="quotes-grid">
                <div class="quote-card">
                    <span class="badge">Opción 1</span>
                    <input type="text" id="p1-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p1-precio" placeholder="Precio (Q)">
                    <select id="p1-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p1-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura:</label>
                    <input type="file" id="p1-file" accept="image/*">
                </div>

                <div class="quote-card">
                    <span class="badge">Opción 2</span>
                    <input type="text" id="p2-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p2-precio" placeholder="Precio (Q)">
                    <select id="p2-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p2-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura:</label>
                    <input type="file" id="p2-file" accept="image/*">
                </div>

                <div class="quote-card">
                    <span class="badge">Opción 3</span>
                    <input type="text" id="p3-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p3-precio" placeholder="Precio (Q)">
                    <select id="p3-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p3-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura:</label>
                    <input type="file" id="p3-file" accept="image/*">
                </div>
            </div>

            <button onclick="generarComparativa()" class="main-btn">Generar Cuadro para Impresión</button>
        </section>

        <section id="result-section" class="hidden">
            <div class="result-header">
                <h3>PRODUCTO: <span id="res-producto"></span></h3>
                <p>Fecha: <span id="fecha-hoy"></span></p>
            </div>

            <table id="tabla-comparativa">
                <thead>
                    <tr>
                        <th width="25%">Detalle</th>
                        <th id="th-p1">Opción 1</th>
                        <th id="id-p2">Opción 2</th>
                        <th id="id-p3">Opción 3</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    </tbody>
            </table>

            <div class="signature-area">
                <div class="sig-box">
                    <div class="line"></div>
                    <p>Firma de Autorización</p>
                    <p class="small">Dirección Técnica / Gerencia</p>
                </div>
            </div>

            <div class="no-print actions">
                <button onclick="window.print()" class="print-btn">🖨️ Imprimir Cuadro</button>
                <button onclick="location.reload()" class="reset-btn">Nueva Cotización</button>
            </div>
        </section>
    </div>
</body>
<script src="script.js"></script>
</html>
