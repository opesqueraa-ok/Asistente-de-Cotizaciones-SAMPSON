<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.jpeg" alt="Logo Sampson" class="logo-img">
        <div class="header-text">
            <h2>CUADRO COMPARATIVO DE OFERTAS</h2>
            <p>Departamento de Compras y Planificación</p>
        </div>
    </header>

    <div class="container">
        
        <section id="form-section" class="no-print">
            <div class="input-main">
                <label>Descripción del Producto o Servicio (Ej: Tubería PVC 2"):</label>
                <input type="text" id="prod-nombre" placeholder="Nombre del producto a agregar...">
                
                <label style="margin-top: 15px; display: block;">Cantidad:</label>
                <input type="number" id="prod-cantidad" placeholder="Ej: 5" min="1" value="1">
            </div>

            <div class="quotes-grid">
                <div class="quote-card">
                    <span class="badge">Opción 1</span>
                    <input type="text" id="p1-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p1-precio" placeholder="Precio Unitario (Q)">
                    <select id="p1-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p1-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura (Local):</label>
                    <input type="file" id="p1-file" accept="image/*">
                </div>

                <div class="quote-card">
                    <span class="badge">Opción 2</span>
                    <input type="text" id="p2-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p2-precio" placeholder="Precio Unitario (Q)">
                    <select id="p2-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p2-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura (Local):</label>
                    <input type="file" id="p2-file" accept="image/*">
                </div>

                <div class="quote-card">
                    <span class="badge">Opción 3</span>
                    <input type="text" id="p3-nom" placeholder="Nombre Proveedor">
                    <input type="number" id="p3-precio" placeholder="Precio Unitario (Q)">
                    <select id="p3-envio">
                        <option value="No">Envío incluido: No</option>
                        <option value="Sí">Envío incluido: Sí</option>
                    </select>
                    <textarea id="p3-obs" placeholder="Garantía, tiempo de entrega..."></textarea>
                    <label class="file-label">📸 Foto/Captura (Local):</label>
                    <input type="file" id="p3-file" accept="image/*">
                </div>
            </div>

            <button onclick="agregarProducto()" class="main-btn" id="btn-agregar">
                ➕ Agregar Producto al Proyecto
            </button>
        </section>

        <section id="project-section">
            <div id="fecha-contenedor" class="hidden">
                <p><b>Fecha de emisión:</b> <span id="fecha-hoy"></span></p>
            </div>

            <div id="tablas-container"></div>

            <div class="signature-area hidden" id="firma-area">
                <div class="sig-box">
                    <div class="line"></div>
                    <p>Firma de Autorización</p>
                    <p class="small">Dirección Técnica / Gerencia</p>
                </div>
            </div>
        </section>

        <div class="actions no-print hidden" id="print-actions">
            <button onclick="window.print()" class="print-btn">🖨️ Imprimir Proyecto Completo</button>
            <button onclick="location.reload()" class="reset-btn">🗑️ Empezar Nuevo Proyecto</button>
        </div>

    </div>
</body>
<script src="script.js"></script>
</html>
