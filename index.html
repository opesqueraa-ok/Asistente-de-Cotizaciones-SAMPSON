<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMPSON - Comparador de Cotizaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>📋 Generador de Cuadro Comparativo</h2>
        <p>SAMPSON - Arquitectura & Construcción</p>
    </header>

    <div class="container">
        <section id="form-section">
            <div class="input-group">
                <label>Producto / Servicio:</label>
                <input type="text" id="prod-nombre" placeholder="Ej: Cemento Tolteca">
            </div>

            <div class="quotes-grid">
                <div class="quote-card">
                    <h3>Opción 1</h3>
                    <input type="text" id="p1-nom" placeholder="Proveedor">
                    <input type="number" id="p1-precio" placeholder="Precio (Q)">
                    <select id="p1-envio">
                        <option value="No">¿Envío incluido? No</option>
                        <option value="Sí">¿Envío incluido? Sí</option>
                    </select>
                    <textarea id="p1-obs" placeholder="Observaciones..."></textarea>
                    <input type="text" id="p1-link" placeholder="Link de Foto (URL)">
                </div>

                <div class="quote-card">
                    <h3>Opción 2</h3>
                    <input type="text" id="p2-nom" placeholder="Proveedor">
                    <input type="number" id="p2-precio" placeholder="Precio (Q)">
                    <select id="p2-envio">
                        <option value="No">¿Envío incluido? No</option>
                        <option value="Sí">¿Envío incluido? Sí</option>
                    </select>
                    <textarea id="p2-obs" placeholder="Observaciones..."></textarea>
                    <input type="text" id="p2-link" placeholder="Link de Foto (URL)">
                </div>
            </div>

            <button onclick="generarComparativa()" class="main-btn">Generar Cuadro Comparativo</button>
        </section>

        <section id="result-section" class="hidden">
            <h3>Cuadro Comparativo de <span id="res-producto"></span></h3>
            <table id="tabla-comparativa">
                <thead>
                    <tr>
                        <th>Detalle</th>
                        <th id="th-p1">Proveedor 1</th>
                        <th id="th-p2">Proveedor 2</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    </tbody>
            </table>
            <button onclick="window.print()" class="print-btn">🖨️ Imprimir para Firma</button>
            <button onclick="reiniciar()" class="reset-btn">Nueva Cotización</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
